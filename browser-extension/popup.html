<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 220px;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f9fafb;
    }

    h3 {
      margin: 0 0 10px 0;
      color: #111827;
    }

    .status-container {
      padding: 10px;
      border-radius: 6px;
      background: white;
      border: 1px solid #e5e7eb;
    }

    .label {
      font-size: 12px;
      color: #6b7280;
    }

    .status {
      font-weight: bold;
      font-size: 16px;
      margin-top: 4px;
      display: block;
    }

    .active {
      color: #10b981;
    }

    .inactive {
      color: #ef4444;
    }

    .note {
      margin-top: 10px;
      font-size: 11px;
      color: #9ca3af;
    }
  </style>
</head>

<body>
  <h3>AI Safe Network</h3>
  <div class="status-container">
    <span class="label">Background Protection</span>
    <span id="status" class="status">Checking...</span>
  </div>
  <div class="note">Run local backend to enable analysis.</div>
  <script src="popup.js"></script>
</body>

</html>
